<!doctype html>
<!-- Source for og-image.png (1200x630). Re-render with headless Chrome; not linked from the site. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: #f4f4f7;
    background:
      radial-gradient(700px 420px at 92% 18%, rgba(224, 27, 34, .42), transparent 70%),
      radial-gradient(520px 380px at 6% 105%, rgba(224, 27, 34, .22), transparent 70%),
      #0e0e12;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 64px; width: 620px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; letter-spacing: -.01em; }

  .eyebrow { margin-top: 44px; font-size: 20px; font-weight: 700; letter-spacing: .14em; color: #ff4a50; }
  h1 { margin: 14px 0 0; font-size: 64px; line-height: 1.04; letter-spacing: -.035em; font-weight: 800; }
  h1 span { color: #ff3b42; }
  p { margin: 22px 0 0; font-size: 25px; line-height: 1.4; color: #b9b9c6; max-width: 560px; }
  .chips { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 12px; }
  .chip { padding: 10px 18px; border-radius: 999px; font-size: 19px; font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .chip.red { background: #e01b22; border-color: #e01b22; color: #fff; }
  .phone {
    position: absolute; width: 250px; padding: 9px; border-radius: 34px; background: #000;
    box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
  }
  .phone img { display: block; width: 100%; border-radius: 26px; }
  .p1 { left: 726px; top: 92px; transform: rotate(-6deg); }
  .p2 { left: 918px; top: 48px; transform: rotate(5deg); }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="icon.svg" alt="">YT Activity Tracker</div>
    <div class="eyebrow">FOR GAMERS · STREAMERS · CREATORS</div>
    <h1>Track every minute of your <span>YouTube</span> grind.</h1>
    <p>Every channel, live stream and playlist you watch, tracked privately on your Android phone.</p>
  </div>
  <div class="chips">
    <div class="chip red">Free APK</div>
    <div class="chip">Android 8+</div>
    <div class="chip">100% on-device</div>
  </div>
  <div class="phone p1"><img src="screens/dash-full.webp" alt=""></div>
  <div class="phone p2"><img src="screens/channels-full.webp" alt=""></div>
